name: Release Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  deploy-release:
    name: Deploy Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'chore(release):')
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install build

    - name: Configure Git
      run: |
        git config --global user.name "semantic-release"
        git config --global user.email "semantic-release@devpocket.com"

    - name: Extract version and create tag
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # Extract version from pyproject.toml
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "Current version: $VERSION"

        # Create and push tag
        git tag "v$VERSION"
        git push origin "v$VERSION"

        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build package
      run: |
        python -m build

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # Create GitHub release
        gh release create "v${{ env.VERSION }}" \
          --title "Release v${{ env.VERSION }}" \
          --notes "Automated release v${{ env.VERSION }}" \
          --target main \
          dist/*

    - name: Build Docker image
      run: |
        # Build and tag the Docker image
        docker build --platform linux/amd64 -t digitop/devpocket-api:${{ env.VERSION }} .
        docker tag digitop/devpocket-api:${{ env.VERSION }} digitop/devpocket-api:latest

        # Optional: Add Docker Hub push here if needed
        # docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PAT }}
        # docker push digitop/devpocket-api:${{ env.VERSION }}
        # docker push digitop/devpocket-api:latest

    - name: Deploy to production
      uses: "digitopvn/diginext-actions@v2"
      with:
        api_key: ${{ secrets.DX_API_KEY }}
        cluster: dxupprod
        registry: digitopdockerhub
        deploy_env: prod
        tail: false
        port: 8000

    - name: Create deployment summary
      run: |
        echo "## 🚀 Production Release Deployed" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed**: ✅ Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Docker Image**: digitop/devpocket-api:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
