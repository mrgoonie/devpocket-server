name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install build

    - name: Configure Git
      run: |
        git config --global user.name "semantic-release"
        git config --global user.email "semantic-release@devpocket.com"

    - name: Check if release is needed
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # Check what the next version would be
        echo "Checking if release is needed..."
        NEXT_VERSION=$(semantic-release version --print --noop 2>/dev/null || echo "No release")

        if [ "$NEXT_VERSION" = "No release" ] || echo "$NEXT_VERSION" | grep -q "No release will be made"; then
          echo "No release needed"
          echo "RELEASE_NEEDED=false" >> $GITHUB_ENV
        else
          echo "Release needed with version: $NEXT_VERSION"
          echo "RELEASE_NEEDED=true" >> $GITHUB_ENV
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
        fi

    - name: Create release branch and PR
      if: env.RELEASE_NEEDED == 'true'
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        REPOSITORY_USERNAME: __token__
        REPOSITORY_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Create a release branch
        RELEASE_BRANCH="release/v${{ env.NEXT_VERSION }}"
        git checkout -b "$RELEASE_BRANCH"

        # Run semantic release on the branch (this will create the version bump)
        semantic-release version --no-push --no-tag --no-vcs-release

        # Push the release branch
        git push origin "$RELEASE_BRANCH"

        # Create a pull request
        gh pr create \
          --title "chore(release): v${{ env.NEXT_VERSION }}" \
          --body "Automated release PR for version ${{ env.NEXT_VERSION }}

        This PR contains:
        - Version bump to ${{ env.NEXT_VERSION }}
        - Updated CHANGELOG.md
        - Ready for production release

        Once merged, the production deployment will be triggered automatically." \
          --base main \
          --head "$RELEASE_BRANCH" \
          --label "release"

        echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV
        echo "RELEASE_MADE=true" >> $GITHUB_ENV


    - name: Create release summary
      if: env.RELEASE_MADE == 'true'
      run: |
        echo "## 📋 Release PR Created" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.NEXT_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ env.RELEASE_BRANCH }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: PR created for review" >> $GITHUB_STEP_SUMMARY
        echo "- **Next**: Merge the PR to deploy to production" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify Release Failure
    runs-on: ubuntu-latest
    needs: [release]
    if: failure()

    steps:
    - name: Notify failure
      run: |
        echo "Release failed! Check the logs above for details."
        echo "Failed commit: ${{ github.sha }}"
        echo "Failed branch: ${{ github.ref }}"
