name: Beta Release

on:
  push:
    branches:
      - beta
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  release:
    name: Beta Release
    runs-on: ubuntu-latest
    concurrency: beta-release
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install build

    - name: Configure Git
      run: |
        git config --global user.name "semantic-release"
        git config --global user.email "semantic-release@devpocket.com"

    - name: Run Semantic Release (Beta)
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        REPOSITORY_USERNAME: __token__
        REPOSITORY_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Check what the next version would be
        echo "Checking if beta release is needed..."
        NEXT_VERSION=$(semantic-release version --print 2>/dev/null || echo "No release")

        if [ "$NEXT_VERSION" = "No release" ] || echo "$NEXT_VERSION" | grep -q "No release will be made"; then
          echo "No beta release needed"
          echo "RELEASE_MADE=false" >> $GITHUB_ENV
        else
          echo "Making beta release with version: $NEXT_VERSION"
          semantic-release version
          echo "RELEASE_MADE=true" >> $GITHUB_ENV
          echo "VERSION=$NEXT_VERSION" >> $GITHUB_ENV
        fi

    - name: Build Docker image
      if: env.RELEASE_MADE == 'true'
      run: |
        # Build and tag the Docker image for beta
        docker build --platform linux/amd64 -t digitop/devpocket-api:${{ env.VERSION }} .
        docker tag digitop/devpocket-api:${{ env.VERSION }} digitop/devpocket-api:beta

        # Optional: Add Docker Hub push here if needed
        # docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PAT }}
        # docker push digitop/devpocket-api:${{ env.VERSION }}
        # docker push digitop/devpocket-api:beta

    - name: Deploy to beta environment
      if: env.RELEASE_MADE == 'true'
      uses: "digitopvn/diginext-actions@v2"
      with:
        api_key: ${{ secrets.DX_API_KEY }}
        cluster: dxupprod
        registry: digitopdockerhub
        deploy_env: beta
        tail: false
        port: 8000

    - name: Create release summary
      if: env.RELEASE_MADE == 'true'
      run: |
        echo "## 🧪 Beta Release Deployed" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: beta" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployed**: ✅ Beta Environment" >> $GITHUB_STEP_SUMMARY
        echo "- **Type**: Pre-release" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify Beta Release Failure
    runs-on: ubuntu-latest
    needs: [release]
    if: failure()

    steps:
    - name: Notify failure
      run: |
        echo "Beta release failed! Check the logs above for details."
        echo "Failed commit: ${{ github.sha }}"
        echo "Failed branch: ${{ github.ref }}"
