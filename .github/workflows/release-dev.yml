name: Development Release

on:
  push:
    branches:
      - dev/*

env:
  PYTHON_VERSION: "3.11"

jobs:
  release:
    name: Development Release
    runs-on: ubuntu-latest
    concurrency: dev-release
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install build

    - name: Configure Git
      run: |
        git config --global user.name "semantic-release"
        git config --global user.email "semantic-release@devpocket.com"

    - name: Run Semantic Release (Dev)
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        REPOSITORY_USERNAME: __token__
        REPOSITORY_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        # Check what the next version would be
        echo "Checking if dev release is needed..."
        NEXT_VERSION=$(semantic-release version --print 2>/dev/null || echo "No release")

        if [ "$NEXT_VERSION" = "No release" ] || echo "$NEXT_VERSION" | grep -q "No release will be made"; then
          echo "No dev release needed"
          echo "RELEASE_MADE=false" >> $GITHUB_ENV
        else
          echo "Making dev release with version: $NEXT_VERSION"
          semantic-release version
          echo "RELEASE_MADE=true" >> $GITHUB_ENV
        fi

    - name: Create release summary
      if: env.RELEASE_MADE == 'true'
      run: |
        VERSION=$(git describe --tags --abbrev=0)
        echo "## 🚀 Development Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Type**: Development Pre-release" >> $GITHUB_STEP_SUMMARY
