name: "nodejs"
display_name: "Node.js 18 LTS"
description: "Node.js development environment with npm, yarn, popular packages, and persistent tmux sessions. Includes sudo access for system package installation and essential development tools."
category: "programming_language"
tags:
  - "nodejs"
  - "npm"
  - "yarn"
  - "express"
  - "react"
  - "vue"
  - "javascript"
  - "sudo"
  - "tmux"
docker_image: "node:18-slim"
default_port: 3000
default_resources:
  cpu: "500m"
  memory: "1Gi"
  storage: "10Gi"
environment_variables:
  NODE_ENV: "development"
  npm_config_cache: "/tmp/npm-cache"
  DEBIAN_FRONTEND: "noninteractive"
  USER: "devpocket"
  HOME: "/home/devpocket"
startup_commands:
  - "apt-get update"
  - "apt-get install -y sudo curl wget git vim nano build-essential unzip tar gzip tmux"
  - "useradd -m -s /bin/bash devpocket"
  - "echo 'devpocket:devpocket' | chpasswd"
  - "usermod -aG sudo devpocket"
  - "echo 'devpocket ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"
  - "mkdir -p /home/devpocket/workspace"
  - "chown -R devpocket:devpocket /home/devpocket"
  - "su - devpocket -c 'npm install -g nodemon typescript @types/node yarn'"
documentation_url: "https://nodejs.org/en/docs/"
icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg"
