name: "ubuntu"
display_name: "Ubuntu 22.04 LTS"
description: "Ubuntu environment with sudo access, essential development tools, and persistent tmux sessions. Includes a non-root user with sudo privileges for package installation and system management."
category: "operating_system"
tags:
  - "ubuntu"
  - "linux"
  - "bash"
  - "shell"
  - "development"
  - "sudo"
  - "tmux"
docker_image: "ubuntu:22.04"
default_port: 8080
default_resources:
  cpu: "500m"
  memory: "1Gi"
  storage: "10Gi"
environment_variables:
  DEBIAN_FRONTEND: "noninteractive"
  TERM: "xterm-256color"
  USER: "devpocket"
  HOME: "/home/devpocket"
startup_commands:
  - "apt-get update"
  - "apt-get install -y sudo curl wget git vim nano build-essential software-properties-common apt-transport-https ca-certificates gnupg lsb-release unzip tar gzip tmux"
  - "useradd -m -s /bin/bash devpocket"
  - "echo 'devpocket:devpocket' | chpasswd"
  - "usermod -aG sudo devpocket"
  - "echo 'devpocket ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"
  - "mkdir -p /home/devpocket/workspace"
  - "chown -R devpocket:devpocket /home/devpocket"
documentation_url: "https://ubuntu.com/server/docs"
icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/ubuntu/ubuntu-plain.svg"
