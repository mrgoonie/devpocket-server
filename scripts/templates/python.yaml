name: "python"
display_name: "Python 3.11"
description: "Python development environment with pip, virtualenv, common packages pre-installed, and persistent tmux sessions. Includes sudo access for system package installation and essential development tools."
category: "programming_language"
tags:
  - "python"
  - "python3"
  - "pip"
  - "virtualenv"
  - "flask"
  - "django"
  - "sudo"
  - "tmux"
docker_image: "python:3.11-slim"
default_port: 8080
default_resources:
  cpu: "500m"
  memory: "1Gi"
  storage: "10Gi"
environment_variables:
  PYTHONPATH: "/workspace"
  PIP_CACHE_DIR: "/tmp/pip-cache"
  DEBIAN_FRONTEND: "noninteractive"
  USER: "devpocket"
  HOME: "/home/devpocket"
startup_commands:
  - "apt-get update"
  - "apt-get install -y sudo curl wget git vim nano build-essential unzip tar gzip tmux"
  - "useradd -m -s /bin/bash devpocket"
  - "echo 'devpocket:devpocket' | chpasswd"
  - "usermod -aG sudo devpocket"
  - "echo 'devpocket ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"
  - "mkdir -p /home/devpocket/workspace"
  - "chown -R devpocket:devpocket /home/devpocket"
  - "su - devpocket -c 'pip install --upgrade pip'"
  - "su - devpocket -c 'pip install flask fastapi uvicorn jupyter pandas numpy requests virtualenv'"
documentation_url: "https://docs.python.org/3/"
icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg"
