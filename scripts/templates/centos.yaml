name: "centos"
display_name: "CentOS Stream 9"
description: "CentOS environment with sudo access, essential development tools, and persistent tmux sessions. Includes a non-root user with sudo privileges for package installation and system management."
category: "operating_system"
tags:
  - "centos"
  - "linux"
  - "bash"
  - "shell"
  - "development"
  - "sudo"
  - "redhat"
  - "tmux"
docker_image: "quay.io/centos/centos:stream9"
default_port: 8080
default_resources:
  cpu: "500m"
  memory: "1Gi"
  storage: "10Gi"
environment_variables:
  TERM: "xterm-256color"
  USER: "devpocket"
  HOME: "/home/devpocket"
startup_commands:
  - "dnf update -y"
  - "dnf groupinstall -y 'Development Tools'"
  - "dnf install -y sudo curl wget git vim nano unzip tar gzip which tmux"
  - "useradd -m -s /bin/bash devpocket"
  - "echo 'devpocket:devpocket' | chpasswd"
  - "usermod -aG wheel devpocket"
  - "echo 'devpocket ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers"
  - "mkdir -p /home/devpocket/workspace"
  - "chown -R devpocket:devpocket /home/devpocket"
documentation_url: "https://docs.centos.org/"
icon_url: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/centos/centos-original.svg"
