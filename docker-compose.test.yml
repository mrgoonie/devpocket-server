services:
  # Test runner service (optimized for unit tests)
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test.unit
      platforms:
        - linux/amd64
    volumes:
      - .:/app
      - test-coverage:/app/htmlcov
      - test-reports:/app/reports
    environment:
      - MONGODB_URL=mongodb://testuser:testpass@mongo-test:27017/?authSource=admin
      - DATABASE_NAME=devpocket_test
      - REDIS_URL=redis://redis-test:6379
      - ENVIRONMENT=test
      - DEBUG=true
      - SECRET_KEY=test-secret-key-for-testing-only
      - LOG_LEVEL=WARNING
      - TESTING=true
      # Timeout settings to prevent hanging
      - PYTEST_TIMEOUT=300
      - ASYNC_TIMEOUT=30
    depends_on:
      mongo-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network
    labels:
      - "test=devpocket"
    # Default to safe unit tests - can be overridden
    command: ["pytest", "tests/", "-m", "not integration", "-v", "--tb=short"]

  # Integration test runner service (separate to prevent hanging issues)
  integration-test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
      platforms:
        - linux/amd64
    volumes:
      - .:/app
      - test-coverage:/app/htmlcov
      - test-reports:/app/reports
      # Mount kubeconfig if available
      - ${HOME}/.kube:/root/.kube:ro
    environment:
      - MONGODB_URL=mongodb://testuser:testpass@mongo-test:27017/?authSource=admin
      - DATABASE_NAME=devpocket_integration_test
      - REDIS_URL=redis://redis-test:6379
      - ENVIRONMENT=test
      - DEBUG=true
      - SECRET_KEY=test-secret-key-for-integration-testing
      - LOG_LEVEL=INFO
      - TESTING=false  # Allow real K8s operations
      # Longer timeouts for integration tests
      - PYTEST_TIMEOUT=600
      - ASYNC_TIMEOUT=60
    depends_on:
      mongo-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network
    labels:
      - "test=devpocket"
    # Run integration tests with strict limits
    command: ["pytest", "tests/", "-m", "integration", "-v", "-s", "--tb=short", "--maxfail=1"]

  # Test MongoDB
  mongo-test:
    image: mongo:7.0
    container_name: devpocket-mongo-test
    environment:
      - MONGO_INITDB_ROOT_USERNAME=testuser
      - MONGO_INITDB_ROOT_PASSWORD=testpass
      - MONGO_INITDB_DATABASE=devpocket_test
    volumes:
      - mongo-test-data:/data/db
    networks:
      - test-network
    labels:
      - "test=devpocket"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Test Redis
  redis-test:
    image: redis:7.2-alpine
    container_name: devpocket-redis-test
    command: redis-server --appendonly yes
    volumes:
      - redis-test-data:/data
    networks:
      - test-network
    labels:
      - "test=devpocket"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  test-network:
    driver: bridge
    labels:
      - "test=devpocket"

volumes:
  mongo-test-data:
    labels:
      - "test=devpocket"
  redis-test-data:
    labels:
      - "test=devpocket"
  test-coverage:
    labels:
      - "test=devpocket"
  test-reports:
    labels:
      - "test=devpocket"
