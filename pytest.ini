[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
    -v
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests that require Kubernetes cluster access
    unit: marks tests as unit tests (default for tests without explicit markers)
    requires_kubeconfig: marks tests that require kubeconfig file access
    api: marks tests for API endpoint functionality
    service: marks tests for service layer functionality
    websocket: marks tests for WebSocket functionality
    auth: marks tests for authentication functionality
    environment: marks tests for environment management
    database: marks tests that require database operations
    external: marks tests that require external services or network calls
